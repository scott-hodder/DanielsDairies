<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing - Daniel's Diaries</title>
  <link rel="icon" type="image/png" href="/images/logos/FM-LOGO-Light.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/styles/billing.css" rel="stylesheet" />
</head>
<body>
  <main class="billing-shell">
    <header class="billing-header">
      <a href="/dashboard.html" class="back-link">← Back to dashboard</a>
      <button id="logoutButton" class="ghost-btn" type="button">Logout</button>
    </header>

    <section class="card hero">
      <h1>Billing & Credits (Phase 1: No Stripe)</h1>
      <p>Manage subscription tier metadata and inspect monthly credits. Add test credits manually in Supabase or with the quick grant form below.</p>
    </section>

    <section class="card" id="statusMessage" style="display:none;"></section>

    <section class="card">
      <h2>Plan tiers</h2>
      <div id="tiersGrid" class="tiers-grid"></div>
    </section>

    <section class="card">
      <h2>Subscription profile</h2>
      <form id="subscriptionForm" class="form-grid">
        <label>Tier <select id="tierSelect"></select></label>
        <label>Status
          <select id="statusSelect">
            <option value="active">active</option>
            <option value="trialing">trialing</option>
            <option value="past_due">past_due</option>
            <option value="paused">paused</option>
            <option value="canceled">canceled</option>
            <option value="inactive">inactive</option>
          </select>
        </label>
        <label>Current period start <input id="periodStart" type="date" required /></label>
        <label>Current period end <input id="periodEnd" type="date" required /></label>
        <label class="inline-check"><input id="cancelAtPeriodEnd" type="checkbox" /> Cancel at period end</label>
        <button type="submit">Save subscription profile</button>
      </form>
    </section>

    <section class="card">
      <h2>Current wallet</h2>
      <p id="periodLabel" class="muted"></p>
      <div class="wallet-grid">
        <div><span>Granted</span><strong id="creditsGranted">0</strong></div>
        <div><span>Used</span><strong id="creditsUsed">0</strong></div>
        <div><span>Available</span><strong id="creditsAvailable">0</strong></div>
      </div>
      <form id="quickGrantForm" class="quick-form">
        <label>Add test credits <input id="quickGrantCredits" type="number" min="1" step="1" value="1" required /></label>
        <button type="submit">Grant credits</button>
      </form>
    </section>

    <section class="card">
      <h2>Ledger (current period)</h2>
      <div id="ledgerRows" class="ledger-rows"></div>
    </section>
  </main>

  <script type="module" src="/src/billing.js"></script>
</body>
</html>
