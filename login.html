<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Diaries - Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logos/dd-favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logos/dd-favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logos/dd-favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=&#39;all&#39;">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Sky background (matches landing page) ── */
        .login-scene {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 40px 20px;
        }

        .sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                #d4eaf7 0%, #e3f1fb 35%, #eef6fd 60%,
                #c8e6c9 82%, #81c784 92%, #4caf50 100%
            );
            z-index: 0;
        }

        /* ── Clouds ── */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 100px;
            z-index: 1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud-1 { width: 180px; height: 50px; top: 8%; left: -5%; animation: cloudDrift1 35s linear infinite; }
        .cloud-1::before { width: 70px; height: 70px; top: -35px; left: 30px; }
        .cloud-1::after { width: 90px; height: 80px; top: -40px; right: 20px; }
        .cloud-2 { width: 140px; height: 40px; top: 14%; right: 5%; animation: cloudDrift2 42s linear infinite; }
        .cloud-2::before { width: 55px; height: 55px; top: -28px; left: 20px; }
        .cloud-2::after { width: 70px; height: 60px; top: -32px; right: 15px; }
        .cloud-3 { width: 200px; height: 55px; top: 22%; left: 25%; animation: cloudDrift3 50s linear infinite; }
        .cloud-3::before { width: 80px; height: 75px; top: -38px; left: 35px; }
        .cloud-3::after { width: 100px; height: 85px; top: -42px; right: 25px; }
        .cloud-4 { width: 120px; height: 35px; top: 6%; left: 55%; opacity: 0.7; animation: cloudDrift1 60s linear infinite reverse; }
        .cloud-4::before { width: 45px; height: 45px; top: -22px; left: 18px; }
        .cloud-4::after { width: 60px; height: 50px; top: -26px; right: 12px; }

        @keyframes cloudDrift1 { 0% { transform: translateX(0); } 100% { transform: translateX(120vw); } }
        @keyframes cloudDrift2 { 0% { transform: translateX(0); } 100% { transform: translateX(-120vw); } }
        @keyframes cloudDrift3 { 0% { transform: translateX(0); } 100% { transform: translateX(80vw); } }

        /* ── Hills ── */
        .hills { position: absolute; bottom: 0; left: 0; width: 100%; height: 28%; z-index: 2; overflow: hidden; }
        .hill { position: absolute; border-radius: 50%; }
        .hill-1 { width: 120%; height: 300px; bottom: -100px; left: -10%; background: linear-gradient(180deg, #66bb6a, #43a047); }
        .hill-2 { width: 60%; height: 220px; bottom: -80px; left: -15%; background: linear-gradient(180deg, #81c784, #66bb6a); }
        .hill-3 { width: 55%; height: 200px; bottom: -70px; right: -10%; background: linear-gradient(180deg, #81c784, #66bb6a); }

        /* ── Trees ── */
        .tree { position: absolute; z-index: 3; }
        .tree-trunk { width: 12px; background: #795548; border-radius: 0 0 4px 4px; margin: 0 auto; }
        .tree-top { border-radius: 50%; margin: 0 auto; }
        .tree-1 { bottom: 14%; left: 6%; }
        .tree-1 .tree-trunk { height: 24px; }
        .tree-1 .tree-top { width: 48px; height: 48px; background: linear-gradient(135deg, #388e3c, #2e7d32); margin-bottom: -4px; }
        .tree-2 { bottom: 16%; left: 12%; }
        .tree-2 .tree-trunk { height: 18px; width: 10px; }
        .tree-2 .tree-top { width: 36px; height: 36px; background: linear-gradient(135deg, #43a047, #388e3c); margin-bottom: -3px; }
        .tree-3 { bottom: 12%; right: 8%; }
        .tree-3 .tree-trunk { height: 28px; width: 14px; }
        .tree-3 .tree-top { width: 56px; height: 52px; background: linear-gradient(135deg, #388e3c, #2e7d32); margin-bottom: -5px; }
        .tree-4 { bottom: 15%; right: 16%; }
        .tree-4 .tree-trunk { height: 16px; width: 8px; }
        .tree-4 .tree-top { width: 30px; height: 30px; background: linear-gradient(135deg, #4caf50, #388e3c); margin-bottom: -3px; }

        .grass { position: absolute; bottom: 0; width: 100%; height: 6%; z-index: 4; background: linear-gradient(180deg, transparent, #388e3c); }

        /* ── Stars ── */
        .star { position: absolute; z-index: 5; font-size: 22px; animation: starFloat 4s ease-in-out infinite; opacity: 0.7; }
        .star-1 { top: 30%; left: 10%; animation-delay: 0s; font-size: 18px; }
        .star-2 { top: 18%; right: 12%; animation-delay: 1.2s; font-size: 24px; }
        .star-3 { top: 45%; left: 5%; animation-delay: 2.4s; font-size: 16px; }
        .star-4 { top: 50%; right: 7%; animation-delay: 0.8s; font-size: 20px; }
        .star-5 { top: 35%; right: 22%; animation-delay: 1.8s; font-size: 14px; }
        @keyframes starFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-12px) rotate(15deg); opacity: 1; }
        }

        /* ── Login layout ── */
        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: contentFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes contentFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-character {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-image {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.15));
            animation: characterBob 3s ease-in-out infinite;
        }

        @keyframes characterBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        /* ── Login card ── */
        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            height: 70px;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
        }

        .login-title {
            font-size: 32px;
            color: #1e3a5f;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .login-subtitle {
            color: #5a7a9a;
            font-size: 15px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #1e3a5f;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #dce4ed;
            border-radius: 14px;
            font-size: 16px;
            background-color: #fff;
            color: #1e3a5f;
            outline: none;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #405878;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(64, 88, 120, 0.12);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2b3a55 0%, #405878 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 20px rgba(43, 58, 85, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(43, 58, 85, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background-color: #FFE5E5;
            color: #C62828;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #C62828;
            font-weight: 500;
        }

        .success-message {
            background-color: #E8F5E9;
            color: #2E7D32;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #2E7D32;
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }

        .login-note {
            text-align: center;
            margin-top: 24px;
            color: #5a7a9a;
            font-size: 14px;
        }

        .login-link {
            color: #405878;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .login-link:hover {
            color: #2b3a55;
            text-decoration: underline;
        }

        .info-text {
            font-size: 14px;
            color: #5a7a9a;
            line-height: 1.5;
            margin-bottom: 16px;
            text-align: center;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .login-wrapper {
                grid-template-columns: 1fr;
                gap: 24px;
                max-width: 480px;
            }

            .login-character {
                max-width: 260px;
                margin: 0 auto;
            }

            .character-image {
                max-width: 220px;
            }
        }

        @media (max-width: 768px) {
            .login-scene {
                padding: 20px 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .login-card {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .login-title {
                font-size: 28px;
            }

            .character-image {
                max-width: 180px;
            }

            .login-logo {
                display: none;
            }

            .login-header {
                margin-bottom: 24px;
            }

            .tree, .star { display: none; }
        }
    </style>
</head>
<body>
    <div class="login-scene">
        <!-- Animated sky background -->
        <div class="sky"></div>

        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>

        <span class="star star-1">&#11088;</span>
        <span class="star star-2">&#10024;</span>
        <span class="star star-3">&#11088;</span>
        <span class="star star-4">&#10024;</span>
        <span class="star star-5">&#11088;</span>

        <div class="hills">
            <div class="hill hill-2"></div>
            <div class="hill hill-3"></div>
            <div class="hill hill-1"></div>
        </div>

        <div class="tree tree-1"><div class="tree-top"></div><div class="tree-trunk"></div></div>
        <div class="tree tree-2"><div class="tree-top"></div><div class="tree-trunk"></div></div>
        <div class="tree tree-3"><div class="tree-top"></div><div class="tree-trunk"></div></div>
        <div class="tree tree-4"><div class="tree-top"></div><div class="tree-trunk"></div></div>

        <div class="grass"></div>

        <!-- Login content -->
        <div class="login-wrapper">
            <!-- Character Section -->
            <div class="login-character">
                <img src="/images/characters/DanielTheDogReading.webp" alt="Daniel the Dog" class="character-image">
            </div>

            <!-- Login Card -->
            <div class="login-card">
                <div class="login-header">
                    <img src="/images/logos/FM-LOGO-Light.png" alt="Daniel's Diaries Logo" class="login-logo">
                    <h1 class="login-title">Daniel's Diaries</h1>
                    <p class="login-subtitle">Your journey to understanding yourself</p>
                </div>

                <!-- Error/Success Messages -->
                <div id="errorMessage" class="error-message hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                        <div style="text-align:right; margin-top:8px;">
                            <button type="button" id="forgotPasswordLink" class="login-link" style="font-size:13px; background:none; border:none; padding:0;">Forgot password?</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="loginButton">
                        <span id="loginButtonText">Sign In</span>
                        <span id="loginSpinner" class="spinner hidden"></span>
                    </button>
                </form>

                <!-- Sign Up Form -->
                <form id="signupForm" class="hidden">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="signupPasswordConfirm" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary" id="signupButton">
                        <span id="signupButtonText">Create Account</span>
                        <span id="signupSpinner" class="spinner hidden"></span>
                    </button>
                </form>

                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" class="hidden">
                    <p class="info-text">Enter the email linked to your account and we'll send a password reset link.</p>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="forgotPasswordEmail" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <button type="submit" class="btn-primary" id="forgotPasswordButton">
                        <span id="forgotPasswordButtonText">Send Reset Link</span>
                        <span id="forgotPasswordSpinner" class="spinner hidden"></span>
                    </button>

                    <button type="button" class="login-link" id="forgotBackToLogin" style="display:block; margin:16px auto 0; text-align:center; background:none; border:none;">
                        ← Back to sign in
                    </button>
                </form>

                <!-- Reset Password Form (after email link) -->
                <form id="resetPasswordForm" class="hidden">
                    <p class="info-text">You're almost there! Create a new password for your account.</p>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" id="resetNewPassword" class="form-input" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" id="resetConfirmPassword" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary" id="resetPasswordButton">
                        <span id="resetPasswordButtonText">Update Password</span>
                        <span id="resetPasswordSpinner" class="spinner hidden"></span>
                    </button>

                    <button type="button" class="login-link" id="resetBackToLogin" style="display:block; margin:16px auto 0; text-align:center; background:none; border:none;">
                        ← Back to sign in
                    </button>
                </form>

                <!-- Toggle between login and signup -->
                <p class="login-note">
                    <span id="toggleText">Don't have an account?</span>
                    <a class="login-link" id="toggleLink" href="/">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
