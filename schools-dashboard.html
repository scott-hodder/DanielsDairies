<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Diaries - Schools Program</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logos/FM-LOGO-Light.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logos/FM-LOGO-Light.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f0fdf4;
            min-height: 100vh;
        }

        #schoolsMain {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* ========== Header ========== */
        .schools-header {
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(45, 106, 79, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            height: 40px;
        }

        .header-title {
            font-family: 'League Spartan', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .header-divider {
            width: 2px;
            height: 28px;
            background: rgba(255,255,255,0.3);
            border-radius: 1px;
        }

        .header-school {
            font-size: 14px;
            opacity: 0.85;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-child {
            background: rgba(255, 183, 77, 0.2);
            color: #ffb74d;
            border: 1px solid rgba(255, 183, 77, 0.3);
        }

        .role-practitioner {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-admin {
            background: rgba(245, 200, 66, 0.2);
            color: #f5c842;
            border: 1px solid rgba(245, 200, 66, 0.35);
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-admin:hover {
            background: rgba(245, 200, 66, 0.35);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ========== Tabs ========== */
        .workbook-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 24px 0;
        }

        .workbook-tabs.hidden { display: none !important; }

        .workbook-tab {
            padding: 10px 24px;
            border-radius: 12px 12px 0 0;
            border: 2px solid #d8f3dc;
            border-bottom: none;
            background: #f0fdf4;
            color: #2d6a4f;
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .workbook-tab:hover {
            background: #d8f3dc;
        }

        .workbook-tab.active {
            background: white;
            color: #1b4332;
            border-color: #2d6a4f;
        }

        /* ========== Main ========== */
        .schools-main {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ========== Workbook Container ========== */
        .workbook-wrapper {
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .workbook-header {
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .workbook-icon {
            width: 40px;
            height: 40px;
            background: #2d6a4f;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .workbook-title {
            font-family: 'League Spartan', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #1b4332;
            flex: 1;
        }

        .btn-fullscreen {
            background: rgba(45, 106, 79, 0.15);
            color: #2d6a4f;
            border: 1px solid rgba(45, 106, 79, 0.25);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.2s;
        }

        .btn-fullscreen:hover {
            background: rgba(45, 106, 79, 0.25);
        }

        /* Fullscreen mode */
        .fullscreen-mode {
            position: fixed !important;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            border-radius: 0 !important;
        }

        .fullscreen-mode .workbook-body iframe {
            height: calc(100vh - 60px);
        }

        .workbook-body {
            padding: 0;
            flex: 1;
            display: flex;
        }

        .workbook-body iframe {
            width: 100%;
            height: calc(100vh - 160px);
        }

        /* ========== Empty State ========== */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 22px;
            color: #2d6a4f;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-text {
            color: #6b7c8f;
            font-size: 15px;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ========== Loading ========== */
        .loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            flex-direction: column;
            gap: 16px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #d8f3dc;
            border-top-color: #2d6a4f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: #2d6a4f;
            font-size: 15px;
            font-weight: 600;
        }

        /* ========== Error ========== */
        .error-screen {
            text-align: center;
            padding: 80px 40px;
        }

        .error-icon { font-size: 48px; margin-bottom: 16px; }

        .error-title {
            color: #c62828;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-text { color: #6b7c8f; font-size: 14px; margin-bottom: 24px; }

        .btn-retry {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .schools-header { flex-direction: column; gap: 12px; text-align: center; }
            .header-divider { display: none; }
            .schools-main { padding: 0 12px; margin: 16px auto; }
            .workbook-header { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="schoolsLoading" class="loading-screen">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading your workbook...</p>
    </div>

    <!-- Error -->
    <div id="schoolsError" class="error-screen hidden">
        <div class="error-icon">&#9888;&#65039;</div>
        <h2 class="error-title">Something went wrong</h2>
        <p class="error-text" id="schoolsErrorText">Unable to load your workbook.</p>
        <button class="btn-retry" onclick="window.location.reload()">Try Again</button>
    </div>

    <!-- Main Content -->
    <div id="schoolsMain" class="hidden">
        <!-- Header -->
        <header class="schools-header">
            <div class="header-left">
                <img src="/images/logos/FM-LOGO-Light.png" alt="Logo" class="header-logo">
                <h1 class="header-title">Schools Program</h1>
                <div class="header-divider"></div>
                <span class="header-school" id="schoolsSchoolName">School</span>
            </div>

            <div class="header-right">
                <div class="user-info">
                    <span class="user-name" id="schoolsUserName">User</span>
                    <span class="role-badge" id="schoolsRoleBadge">Role</span>
                </div>
                <a id="adminPanelBtn" href="/admin.html" class="btn-admin hidden">Admin Panel</a>
                <button class="btn-logout" onclick="schoolsLogout()">Sign Out</button>
            </div>
        </header>

        <!-- Main -->
        <main class="schools-main">
            <!-- Empty State -->
            <div id="workbookEmptyState" class="empty-state hidden">
                <div class="empty-icon">&#128218;</div>
                <h2 class="empty-title">No workbook available yet</h2>
                <p class="empty-text">Your school administrator hasn't set up a workbook for your role yet. Please check back soon or contact your practitioner.</p>
            </div>

            <!-- Workbook Tabs (practitioners only) -->
            <div id="workbookTabs" class="workbook-tabs hidden">
                <button class="workbook-tab active" id="tabPractitioner" onclick="switchWorkbookTab('practitioner')">Practitioner Workbook</button>
                <button class="workbook-tab" id="tabChild" onclick="switchWorkbookTab('child')">Child Workbook</button>
            </div>

            <!-- Workbook -->
            <div id="workbookContainer" class="workbook-wrapper hidden">
                <div class="workbook-header">
                    <div class="workbook-icon">&#128214;</div>
                    <h2 class="workbook-title" id="workbookTitle">Workbook</h2>
                    <button class="btn-fullscreen" id="btnFullscreen" onclick="toggleFullscreen()" title="Fullscreen">&#x26F6; Fullscreen</button>
                </div>
                <div class="workbook-body" id="workbookBody"></div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/features/schools/schoolsDashboard.js"></script>
</body>
</html>
