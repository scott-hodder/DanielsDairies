<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Diaries - Login</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logos/DanielsDiariesFavicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logos/DanielsDiariesFavicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logos/DanielsDiariesFavicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'League Spartan', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #dfdbca;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #364f66 0%, #405878 50%, #fffff5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background elements */
        .login-container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-container::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 218, 185, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .login-character {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .character-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.15));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .login-card {
            background-color: #fffff5;
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 3px solid #E8F4F8;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            height: 80px;
            margin-bottom: 16px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
        }

        .login-title {
            font-size: 36px;
            color: #405878;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, #405878 0%, #6B9BD1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: #6B9BD1;
            font-size: 15px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #405878;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8F4F8;
            border-radius: 14px;
            font-size: 16px;
            background-color: #FAFBFC;
            color: #405878;
            outline: none;
            font-family: 'League Spartan', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #4c6c96;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(107, 155, 209, 0.1);
        }

        .form-input::placeholder {
            color: #A8B8C8;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #364f66 0%, #405878 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'League Spartan', sans-serif;
            box-shadow: 0 6px 20px rgba(107, 155, 209, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(107, 155, 209, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background-color: #FFE5E5;
            color: #C62828;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #C62828;
            font-weight: 500;
        }

        .success-message {
            background-color: #E8F5E9;
            color: #2E7D32;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #2E7D32;
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }

        .login-note {
            text-align: center;
            margin-top: 24px;
            color: #6B7C8F;
            font-size: 14px;
        }

        .login-link {
            color: #6B9BD1;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .login-link:hover {
            color: #405878;
            text-decoration: underline;
        }

        .info-text {
            font-size: 14px;
            color: #6B7C8F;
            line-height: 1.5;
            margin-bottom: 16px;
            text-align: center;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .login-wrapper {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .login-character {
                max-width: 300px;
                margin: 0 auto;
            }

            .character-image {
                max-width: 280px;
            }
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 16px;
                align-items: flex-start;
                justify-content: flex-start;
                padding-top: 80px;
            }

            .login-card {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .login-title {
                font-size: 28px;
            }

            .login-wrapper {
                margin-top: -100px;
            }

            .character-image {
                max-width: 200px;
                margin-bottom: -60px;
            }

            .login-logo {
                display: none;
            }

            .login-header {
                margin-bottom: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <!-- Character Section -->
            <div class="login-character">
                <img src="/images/characters/DanielTheDogReading.webp" alt="Daniel the Dog" class="character-image">
            </div>

            <!-- Login Card -->
            <div class="login-card">
                <div class="login-header">
                    <img src="/images/logos/FM-LOGO-Light.webp" alt="Daniel's Diaries Logo" class="login-logo">
                    <h1 class="login-title">Daniel's Diaries</h1>
                    <p class="login-subtitle">Your journey to understanding yourself</p>
                </div>

                <!-- Error/Success Messages -->
                <div id="errorMessage" class="error-message hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                        <div style="text-align:right; margin-top:8px;">
                            <button type="button" id="forgotPasswordLink" class="login-link" style="font-size:13px; background:none; border:none; padding:0;">Forgot password?</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="loginButton">
                        <span id="loginButtonText">Sign In</span>
                        <span id="loginSpinner" class="spinner hidden"></span>
                    </button>
                </form>

                <!-- Sign Up Form -->
                <form id="signupForm" class="hidden">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="signupPasswordConfirm" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary" id="signupButton">
                        <span id="signupButtonText">Create Account</span>
                        <span id="signupSpinner" class="spinner hidden"></span>
                    </button>
                </form>

                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" class="hidden">
                    <p class="info-text">Enter the email linked to your account and we'll send a password reset link.</p>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="forgotPasswordEmail" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <button type="submit" class="btn-primary" id="forgotPasswordButton">
                        <span id="forgotPasswordButtonText">Send Reset Link</span>
                        <span id="forgotPasswordSpinner" class="spinner hidden"></span>
                    </button>

                    <button type="button" class="login-link" id="forgotBackToLogin" style="display:block; margin:16px auto 0; text-align:center; background:none; border:none;">
                        ← Back to sign in
                    </button>
                </form>

                <!-- Reset Password Form (after email link) -->
                <form id="resetPasswordForm" class="hidden">
                    <p class="info-text">You're almost there! Create a new password for your account.</p>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" id="resetNewPassword" class="form-input" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" id="resetConfirmPassword" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary" id="resetPasswordButton">
                        <span id="resetPasswordButtonText">Update Password</span>
                        <span id="resetPasswordSpinner" class="spinner hidden"></span>
                    </button>

                    <button type="button" class="login-link" id="resetBackToLogin" style="display:block; margin:16px auto 0; text-align:center; background:none; border:none;">
                        ← Back to sign in
                    </button>
                </form>

                <!-- Toggle between login and signup -->
                <p class="login-note">
                    <span id="toggleText">Don't have an account?</span>
                    <a class="login-link" id="toggleLink">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
