<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Diaries: The Day My Feelings Got Too Big</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Daniel's Diaries Brand Colors - Warm & Child-Friendly */
        :root {
            --dd-golden: #F4A261;
            --dd-teal: #2A9D8F;
            --dd-coral: #E76F51;
            --dd-deep: #264653;
            --dd-cream: #FFF8F0;
            --dd-light-teal: #A8E6CF;
            --dd-soft-yellow: #FFE8A3;
        }

        /* Typography */
        .font-title {
            font-family: 'Fredoka One', cursive;
        }
        
        .font-body {
            font-family: 'Nunito', sans-serif;
        }

        body {
            font-family: 'Nunito', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Fredoka One', cursive;
        }

        /* Animations */
        @keyframes wag {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        .animate-wag { animation: wag 0.5s ease-in-out infinite; }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }

        @keyframes shimmer {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .animate-shimmer { animation: shimmer 2s ease-in-out infinite; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(244, 162, 97, 0.3); }
            50% { box-shadow: 0 0 35px rgba(244, 162, 97, 0.6); }
        }
        .animate-glow { animation: pulse-glow 3s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--dd-cream);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--dd-golden);
            border-radius: 10px;
            border: 3px solid var(--dd-cream);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--dd-coral);
        }

        /* Interactive elements */
        .feeling-btn {
            transition: all 0.3s ease;
        }
        .feeling-btn:hover {
            transform: scale(1.05);
        }
        .feeling-btn.selected {
            ring: 4px;
            ring-color: var(--dd-golden);
            transform: scale(1.1);
        }

        /* Body map highlight */
        .body-part {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .body-part:hover {
            filter: brightness(1.2);
        }

        /* Thermometer slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 30px;
            border-radius: 15px;
            background: linear-gradient(to right, #2A9D8F, #FFE8A3, #F4A261, #E76F51);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: 4px solid #264653;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Parent tool sections */
        .parent-tool {
            border: 3px dashed var(--dd-teal);
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
        }

        /* Adjust page height to account for fixed header */
        .page {
            min-height: 100vh !important;
            padding-top: 80px !important;
            padding-bottom: 100px !important;
        }

        /* Hide progress paws on mobile */
        @media (max-width: 768px) {
            #progressPaws {
                display: none !important;
            }
        }

        /* Print styles */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .page { 
                page-break-after: always;
                min-height: 100vh;
                display: block !important;
            }
            #pageContainer { padding-top: 0 !important; }
            input[type="text"], textarea {
                border: 2px solid #999 !important;
                background: white !important;
                color: black !important;
            }
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    
        /* Responsive Navigation Styles */
        @media (max-width: 768px) {
            /* Make navigation buttons smaller on mobile */
            header > div {
                gap: 8px !important;
            }
            
            header button {
                padding: 8px 12px !important;
                font-size: 12px !important;
            }
            
            /* Stack navigation elements on very small screens */
            .no-print > div {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            
            .no-print > div > div {
                width: 100%;
                justify-content: center !important;
            }
            
            /* Make buttons full width on mobile */
            .no-print button {
                padding: 10px 16px !important;
                font-size: 13px !important;
            }
        }

        @media (max-width: 480px) {
            /* Even smaller on very small screens */
            header {
                padding: 12px !important;
            }
            
            header button {
                padding: 6px 10px !important;
                font-size: 11px !important;
            }
            
            .no-print {
                padding: 12px !important;
            }
            
            /* Hide text in buttons, show only icons */
            header button:not(.flex) {
                min-width: 40px;
            }
        }
        /* Hide Progress Dots on Mobile */
        @media (max-width: 768px) {
            .no-print.fixed.left-1\/2 {
                display: none !important;
            }
        }

        

    </style>
</head>
<body style="background-color: #FFF8F0;">
    
    <!-- Top Navigation Bar -->
    <div class="no-print fixed top-0 left-0 right-0 backdrop-blur shadow-lg z-50 p-3" style="background-color: rgba(255, 248, 240, 0.95);">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="prevPage()" class="text-white px-5 py-2 rounded-full font-bold hover:shadow-lg transition-all font-title text-lg" style="background-color: #F4A261;">← Back</button>
                <span class="font-semibold font-body text-lg" style="color: #264653;">Page <span id="currentPageDisplay">1</span> of <span id="totalPageCountDisplay">20</span></span>
                <button onclick="nextPage()" class="text-white px-5 py-2 rounded-full font-bold hover:shadow-lg transition-all font-title text-lg" style="background-color: #F4A261;">Next →</button>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-4 py-2 rounded-full text-white font-bold shadow-md cursor-pointer font-title" style="background: linear-gradient(to right, #F4A261, #E76F51);" onclick="showStarManager()">
                    <span class="text-2xl animate-shimmer">⭐</span>
                    <span id="starCount" class="text-xl">0</span>
                </div>
                <button onclick="toggleParentMode()" id="parentModeBtn" class="px-4 py-2 rounded-full font-bold hover:shadow-lg transition-all font-body text-sm" style="background-color: #2A9D8F; color: white;">👨‍👩‍👧 Parent Mode</button>
                <button onclick="prepareForPrint()" class="text-white px-4 py-2 rounded-full font-bold hover:shadow-lg transition-all font-title" style="background-color: #2A9D8F;">🖨️ Print</button>
                <button onclick="goHome()" class="text-white px-4 py-2 rounded-full font-bold hover:shadow-lg transition-all font-title" style="background-color: #E76F51;">🏠 Home</button>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <div>
        <div id="pageContainer">
            <!-- Pages will be rendered here -->
        </div>
    </div>

    <!-- Progress paws -->
    <div id="progressPaws" class="no-print fixed bottom-8 left-1/2 transform -translate-x-1/2 backdrop-blur rounded-full px-6 py-3 shadow-xl z-40" style="background-color: rgba(255, 248, 240, 0.95);">
        <div id="dotsContainer" class="flex flex-row gap-2"></div>
    </div>

    <!-- Quick jump menu -->
    <div class="no-print fixed right-4 top-24 z-40">
        <button onclick="toggleMenu()" class="text-white p-3 rounded-full shadow-2xl hover:shadow-3xl transition-all mb-2" style="background: linear-gradient(to bottom right, #F4A261, #E76F51); display: flex; align-items: center; justify-content: center;">
            <img src="/DanielTheDogImages/DanielTheDog.png" alt="Daniel" style="width: 32px; height: auto;">
        </button>
        <div id="quickMenu" class="hidden backdrop-blur rounded-2xl shadow-2xl p-4 w-72 max-h-[70vh] overflow-y-auto" style="background-color: rgba(255, 248, 240, 0.98);">
            <h3 class="font-bold mb-3 flex items-center gap-2 text-lg font-title" style="color: #264653;">🐾 Quick Jump</h3>
            <div class="space-y-1" id="menuItems"></div>
        </div>
    </div>

    <!-- Star Manager Modal -->
    <div id="starModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="rounded-3xl shadow-2xl p-8 max-w-md w-full" style="background-color: #FFF8F0;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-title" style="color: #264653;">⭐ Paw-some Stars!</h2>
                <button onclick="hideStarManager()" class="text-3xl font-bold" style="color: #E76F51;">×</button>
            </div>
            
            <div class="space-y-6">
                <div class="border-4 rounded-2xl p-6" style="background: linear-gradient(to bottom right, #FFE8A3, #FFF8F0); border-color: #F4A261;">
                    <div class="text-center mb-4">
                        <div class="text-6xl mb-2 animate-shimmer">⭐</div>
                        <div class="text-5xl font-title" style="color: #264653;" id="modalStarCount">0</div>
                        <p class="font-bold font-body text-lg" style="color: #F4A261;">Total Stars</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="p-3 rounded-xl" style="background-color: white;">
                            <div class="text-2xl font-title" style="color: #F4A261;" id="currentWorkbookStars">0</div>
                            <p class="text-xs font-body" style="color: #2A9D8F;">This Adventure</p>
                        </div>
                        <div class="p-3 rounded-xl" style="background-color: white;">
                            <div class="text-2xl font-title" style="color: #F4A261;" id="allWorkbooksStars">0</div>
                            <p class="text-xs font-body" style="color: #2A9D8F;">All Adventures</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-semibold mb-2 font-body" style="color: #264653;">Add Bonus Stars 🌟</label>
                        <div class="flex gap-2">
                            <input type="number" id="addStarsInput" class="flex-1 border-3 rounded-xl px-4 py-2 font-body text-lg" style="border-color: #F4A261; background-color: white;" placeholder="How many?" min="1">
                            <button onclick="addBonusStars()" class="text-white px-6 py-2 rounded-xl font-bold hover:shadow-lg font-title" style="background-color: #F4A261;">+ Add</button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold mb-2 font-body" style="color: #264653;">Spend Stars on Rewards 🎁</label>
                        <div class="flex gap-2">
                            <input type="number" id="spendStarsInput" class="flex-1 border-3 rounded-xl px-4 py-2 font-body text-lg" style="border-color: #2A9D8F; background-color: white;" placeholder="How many?" min="1">
                            <button onclick="spendStars()" class="text-white px-6 py-2 rounded-xl font-bold hover:shadow-lg font-title" style="background-color: #2A9D8F;">🎁 Spend</button>
                        </div>
                    </div>
                </div>

                <div class="border-l-4 p-4 rounded-lg font-body" style="background-color: #A8E6CF; border-color: #2A9D8F; color: #264653;">
                    <div class="flex items-center gap-2 mb-2">
                        <img src="/DanielTheDogImages/DanielTheDogThumbsUp.png" alt="Daniel" style="width: 30px; height: auto;">
                        <p class="font-semibold">Daniel says:</p>
                    </div>
                    <p class="text-sm">"Every time you finish an activity, you earn a star! Woof! Keep going—you're doing great!"</p>
                </div>

                <button onclick="hideStarManager()" class="w-full text-white py-3 rounded-xl font-bold hover:shadow-lg font-title text-lg" style="background-color: #F4A261;">Close</button>
            </div>
        </div>
    </div>

    <!-- Audio elements for body map -->
    <audio id="audio_head" preload="none">
        <source src="data:audio/wav;base64," type="audio/wav">
    </audio>

    <!-- Hidden print container -->
    <div id="printContainer" style="display: none;"></div>

    <script type="module">
        // ==== Global State ====
        let currentPage = 0;
        let totalStars = 0;
        let completedActivities = {};
        let formData = {};
        let parentModeEnabled = false;
        const WORKBOOK_ID = 'MODULE4';
        let currentChild = null;
        let childId = null;

        // ==== Star System ====
        async function loadStarData() {
            try {
                totalStars = await loadStarsFromDB();
                childId = getChildId();
                
                // Update child name in form data if not set
                const childName = getChildName();
                if (childName && !formData.userName) {
                    formData.userName = childName;
                    saveFormData('userName', childName);
                }
            } catch (error) {
                console.error('Error loading star data:', error);
                totalStars = 0;
            }
            updateStarDisplay();
        }

        async function saveStarData() {
            try {
                await saveStarsToDB(totalStars);
            } catch (error) {
                console.error('Error saving stars:', error);
            }
        }

        function saveStarDataOld() {
            const allStarsData = localStorage.getItem('cbtWorkbookStars');
            let parsed = {};
            if (allStarsData) {
                try {
                    parsed = JSON.parse(allStarsData);
                } catch (e) {
                    parsed = {};
                }
            }
            parsed[WORKBOOK_ID] = totalStars;
            localStorage.setItem('cbtWorkbookStars', JSON.stringify(parsed));
            updateStarDisplay();
        }

        function updateStarDisplay() {
            document.getElementById('starCount').textContent = totalStars;
            const modalCount = document.getElementById('modalStarCount');
            if (modalCount) modalCount.textContent = totalStars;
            const currentWorkbook = document.getElementById('currentWorkbookStars');
            if (currentWorkbook) currentWorkbook.textContent = totalStars;
            
            const allStarsData = localStorage.getItem('cbtWorkbookStars');
            if (allStarsData) {
                try {
                    const parsed = JSON.parse(allStarsData);
                    const allWorkbooksTotal = Object.values(parsed).reduce((a, b) => a + b, 0);
                    const allWorkbooks = document.getElementById('allWorkbooksStars');
                    if (allWorkbooks) allWorkbooks.textContent = allWorkbooksTotal;
                } catch (e) {}
            }

            const progressStars = document.getElementById('progressStars');
            if (progressStars) progressStars.textContent = totalStars;
        }

        async function addBonusStars() {
            const input = document.getElementById('addStarsInput');
            const amount = parseInt(input.value) || 0;
            if (amount > 0) {
                totalStars += amount;
                await saveStarData();
                input.value = '';
                celebrateStar();
            }
        }

        async function spendStars() {
            const input = document.getElementById('spendStarsInput');
            const amount = parseInt(input.value) || 0;
            if (amount > 0 && amount <= totalStars) {
                totalStars -= amount;
                await saveStarData();
                input.value = '';
            } else if (amount > totalStars) {
                alert('Oops! You don\'t have enough stars yet. Keep going!');
            }
        }

        function showStarManager() {
            document.getElementById('starModal').classList.remove('hidden');
            updateStarDisplay();
        }

        function hideStarManager() {
            document.getElementById('starModal').classList.add('hidden');
        }

        function celebrateStar() {
            // Create floating star animation
            const star = document.createElement('div');
            star.textContent = '⭐';
            star.className = 'fixed text-6xl pointer-events-none z-50';
            star.style.left = '50%';
            star.style.top = '50%';
            star.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(star);
            
            star.animate([
                { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 1 },
                { transform: 'translate(-50%, -150%) scale(2)', opacity: 0 }
            ], {
                duration: 1200,
                easing: 'ease-out'
            }).onfinish = () => star.remove();
        }

        async function markActivityComplete(activityId) {
            if (!completedActivities[activityId]) {
                completedActivities[activityId] = true;
                totalStars += 1;
                await saveStarData();
                saveProgress();
                renderPage();
                
                const checkbox = document.querySelector(`input[data-activity="${activityId}"]`);
                if (checkbox) {
                    setTimeout(() => {
                        celebrateStar();
                    }, 100);
                }
            }
        }

        function saveProgress() {
            localStorage.setItem(`cbtWorkbookProgress_${WORKBOOK_ID}`, JSON.stringify(completedActivities));
        }

        // ==== Form Data Persistence ====
        function saveFormData(key, value) {
            formData[key] = value;
            localStorage.setItem(`cbtWorkbookData_${WORKBOOK_ID}`, JSON.stringify(formData));
        }

        function loadFormData() {
            const saved = localStorage.getItem(`cbtWorkbookData_${WORKBOOK_ID}`);
            if (saved) {
                try {
                    formData = JSON.parse(saved);
                } catch (e) {
                    formData = {};
                }
            }
        }

        // ==== Parent Mode ====
        function toggleParentMode() {
            parentModeEnabled = !parentModeEnabled;
            const btn = document.getElementById('parentModeBtn');
            if (parentModeEnabled) {
                btn.style.backgroundColor = '#E76F51';
                btn.textContent = '👨‍👩‍👧 Parent Mode ON';
            } else {
                btn.style.backgroundColor = '#2A9D8F';
                btn.textContent = '👨‍👩‍👧 Parent Mode';
            }
            renderPage();
        }

        // ==== Navigation ====
        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        }

        function jumpToPage(pageNum) {
            currentPage = pageNum;
            renderPage();
            toggleMenu();
        }

        function renderPage() {
            const container = document.getElementById('pageContainer');
            container.innerHTML = pages[currentPage]();
            document.getElementById('currentPageDisplay').textContent = currentPage + 1;
            document.getElementById('totalPageCountDisplay').textContent = pages.length;
            updateDots();
            updateStarDisplay();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Initialize canvas if on drawing page
            setTimeout(() => initCanvas(), 100);
        }

        function updateDots() {
            const container = document.getElementById('dotsContainer');
            container.innerHTML = '';
            pages.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.innerHTML = index === currentPage ? '🐾' : '•';
                dot.className = `cursor-pointer transition-all text-lg ${index === currentPage ? 'scale-125' : 'opacity-50'}`;
                dot.style.color = index === currentPage ? '#F4A261' : '#2A9D8F';
                dot.onclick = () => jumpToPage(index);
                container.appendChild(dot);
            });
        }

        function toggleMenu() {
            const menu = document.getElementById('quickMenu');
            menu.classList.toggle('hidden');
        }

        function renderMenuItems() {
            const container = document.getElementById('menuItems');
            container.innerHTML = menuItems.map(item => `
                <button 
                    onclick="jumpToPage(${item.page})" 
                    class="w-full text-left px-4 py-2 rounded-xl hover:shadow-md transition-all text-sm font-semibold font-body"
                    style="color: #264653; background-color: ${currentPage === item.page ? '#FFE8A3' : 'transparent'};"
                >
                    ${item.icon} ${item.label}
                </button>
            `).join('');
        }

        // ==== Interactive Elements ====
        function setFeelingLevel(level) {
            saveFormData('feeling_level', level);
            renderPage();
        }

        function selectBodyPart(part) {
            const messages = {
                'head': "When I'm worried, my head might feel fuzzy or I get headaches. That's my brain trying to protect me!",
                'chest': "My chest gets tight when I'm scared or nervous. Sometimes my heart beats really fast like when I run!",
                'tummy': "My tummy might feel butterflies or get rumbly when I'm worried or excited. That's okay!",
                'hands': "Sometimes my hands get sweaty or shaky when I'm nervous. They might want to hit things when I'm angry.",
                'legs': "My legs might feel wobbly or want to run away when I'm scared. That's my body trying to keep me safe!"
            };
            saveFormData('selected_body_part', part);
            saveFormData('body_part_message', messages[part] || '');
            renderPage();
        }

        function selectFeeling(feeling) {
            saveFormData('selected_feeling', feeling);
            renderPage();
        }

        function selectScenario(scenario) {
            const explanations = {
                'loud_noise': "WOOF! A loud noise can make Daniel's ears perk up and his body get ready to run or hide. That's called the 'fight or flight' response—it's your body's alarm system!",
                'lost_toy': "When Daniel loses his favourite toy, he might feel sad AND worried at the same time. It's okay to have more than one feeling!",
                'new_place': "New places can be exciting AND scary. Daniel's tail might wag slowly while his eyes look around carefully. His body is being cautious!",
                'friend_upset': "When Daniel's friend is upset, he might feel worried too. Sometimes we feel what others feel—that's called empathy!"
            };
            saveFormData('selected_scenario', scenario);
            saveFormData('scenario_explanation', explanations[scenario] || '');
            renderPage();
        }

        function addCalmItem(item) {
            let calmItems = formData.calm_den_items || [];
            if (!calmItems.includes(item)) {
                calmItems.push(item);
                saveFormData('calm_den_items', calmItems);
                renderPage();
            }
        }

        function removeCalmItem(item) {
            let calmItems = formData.calm_den_items || [];
            calmItems = calmItems.filter(i => i !== item);
            saveFormData('calm_den_items', calmItems);
            renderPage();
        }

        // ==== Print Function ====
        function prepareForPrint() {
            const printContainer = document.getElementById('printContainer');
            printContainer.innerHTML = '';
            printContainer.style.display = 'block';
            
            pages.forEach((pageFunc) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.innerHTML = pageFunc();
                printContainer.appendChild(pageDiv);
            });
            
            setTimeout(() => {
                window.print();
                printContainer.style.display = 'none';
            }, 500);
        }

        // ==== Page Generators ====
        
        // Cover Page
        function generatePage0() {
            return `
                <div class="page min-h-screen flex items-center justify-center p-8" style="background: linear-gradient(to bottom right, #FFE8A3, #FFF8F0);">
                    <div class="text-center max-w-4xl">
                        <div class="mb-6 animate-bounce-slow flex justify-center">
                            <img src="/DanielTheDogImages/DanielTheDog.png" alt="Daniel the Dog" style="width: 180px; height: auto;">

        function startBreathing() {
            const circle = document.getElementById('breathCircle');

            let phase = 'in';
            let count = 0;
            const maxCycles = 3;
            
            if (breathingInterval) clearInterval(breathingInterval);
            
            function animate() {
                if (phase === 'in') {
                    circle.style.transform = 'scale(1.5)';
                    circle.innerHTML = '🌸<br><small>Breathe IN</small>';
                    setTimeout(() => {
                        phase = 'out';
                    }, 4000);
                } else {
                    circle.style.transform = 'scale(1)';
                    circle.innerHTML = '🎂<br><small>Breathe OUT</small>';
                    count++;
                    setTimeout(() => {
                        if (count >= maxCycles) {
                            clearInterval(breathingInterval);
                            circle.innerHTML = '🐕<br><small>Great job!</small>';
                            circle.style.transform = 'scale(1)';
                        } else {
                            phase = 'in';
                        }
                    }, 4000);
                }
            }

        // ==== Canvas Drawing Functions ====
        let canvas, ctx, isDrawing = false, currentColor = '#264653';
        
        function initCanvas() {
            canvas = document.getElementById('drawingCanvas');
            if (!canvas) return;
            
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;
            
            // Load saved drawing if exists
            const saved = formData.canvasDrawing;
            if (saved) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = saved;
            }
            
            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Touch events
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);
        }
        
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }
        
        function startDrawing(e) {
            isDrawing = true;
            const coords = getCanvasCoords(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        }
        
        function draw(e) {
            if (!isDrawing) return;
            const coords = getCanvasCoords(e);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
        }
        
        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                // Save drawing
                formData.canvasDrawing = canvas.toDataURL();
                saveFormData('canvasDrawing', formData.canvasDrawing);
            }
        }
        
        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }
        
        function clearCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            formData.canvasDrawing = '';
            saveFormData('canvasDrawing', '');
        }
        
        function changeColor(color) {
            currentColor = color;
            ctx.strokeStyle = color;
        }
