<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Module...</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/logos/DanielsDiariesFavicon.png">
  <link rel="apple-touch-icon" href="/images/logos/DanielsDiariesFavicon.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Module stylesheets -->
  <link rel="stylesheet" href="/modules/shared/module-header.css">
  <link rel="stylesheet" href="/modules/shared/module-theme.css">
  <link rel="stylesheet" href="/modules/shared/module-base.css">
  
  <!-- Module header script - makes window.initModuleHeader available -->
  <script src="/modules/shared/module-header.js"></script>
  
  <style>
    
    /* Loader */
    .loader-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f3ed, #e8e4d9);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e8e4d9;
      border-top-color: #405878;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: #405878; text-align: center; }
    
    /* Error */
    .error-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f3ed, #e8e4d9);
    }
    .error-box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 450px;
      text-align: center;
    }
    .error-box h2 { color: #264653; margin-bottom: 12px; }
    .error-box p { color: #666; margin-bottom: 24px; }
    .error-box button {
      padding: 12px 24px;
      background: #405878;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 0 8px;
    }
    
    /* Completion Modal Styles */
    .module-completion-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .module-completion-content {
      background: linear-gradient(135deg, #fff8f0 0%, #ffe8d6 100%);
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      animation: scaleIn 0.4s ease;
    }
    
    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
    .completion-emoji {
      font-size: 80px;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    .completion-title {
      font-family: 'Fredoka One', cursive;
      font-size: 36px;
      color: #264653;
      margin-bottom: 16px;
    }
    
    .completion-message {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      color: #405878;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .completion-confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    
    .completion-confetti-piece {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      animation: confettiFall 2s ease forwards;
    }
    
    @keyframes confettiFall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(400px) translateX(var(--tx, 0)) rotate(720deg);
        opacity: 0;
      }
    }
    
    .completion-btn {
      background: linear-gradient(135deg, #f4a261, #e76f51);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 999px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(244, 162, 97, 0.4);
    }
    
    .completion-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 162, 97, 0.5);
    }

    .module-cover-title-block {
      text-align: center;
      margin: 24px auto 32px;
      max-width: 80%;
    }

    .module-cover-title {
      font-family: 'Fredoka One', cursive;
      font-size: 32px;
      color: #264653;
      margin: 0 0 10px;
    }

    .module-cover-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      color: #405878;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body class="module-theme" data-series="custom" data-age-range="9-11">
  <div id="loader" class="loader-container">
    <div>
      <div class="spinner"></div>
      <p class="loader-text">Loading module...</p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './src/supabaseClient.js';
    
    // =========================================
    // URL PARAMETERS
    // =========================================
    const params = new URLSearchParams(window.location.search);
    const moduleCode = params.get('code');
    const childId = params.get('childId');
    const moduleId = params.get('moduleId');
    const parentUserId = params.get('parentUserId');
    const LEVEL_XP = 100;
    
    window.supabase = supabase;
    window.childId = childId;
    window.moduleId = moduleId;
    window.parentUserId = parentUserId;
    window.moduleCode = moduleCode;
    
    const _state = { 
      childId, 
      currentChild: null,
      moduleDbId: null
    };
    
    // =========================================
    // RESPONSE TRACKER
    // =========================================
    const ResponseTracker = {
      async getModuleDbId() {
        if (_state.moduleDbId) return _state.moduleDbId;
        if (!moduleCode) return null;
        try {
          const { data } = await supabase.from('modules').select('id').eq('code', moduleCode).single();
          if (data) _state.moduleDbId = data.id;
          return _state.moduleDbId;
        } catch (e) { return null; }
      },
      
      getCacheKey() { return `module_responses_${moduleCode}_${childId}`; },
      
      getCache() {
        try {
          return JSON.parse(localStorage.getItem(this.getCacheKey()) || '{}');
        } catch (e) { return {}; }
      },
      
      saveCache(data) {
        try { localStorage.setItem(this.getCacheKey(), JSON.stringify(data)); } catch (e) { /* ignore */ }
      },
      
      async track(data) {
        const cache = this.getCache();
        cache[data.questionId] = { ...data, timestamp: Date.now() };
        this.saveCache(cache);
        
        // DEBUG: Log what we're saving
        console.log('[ResponseTracker] Saved:', data.questionId, '=', data.responseValue);
        console.log('[ResponseTracker] Cache now has', Object.keys(cache).length, 'items');
        
        this.saveToDB(data).catch(e => {
          console.error('[ResponseTracker] DB save failed:', e);
        });
        return cache[data.questionId];
      },
      
      async saveToDB(data) {
        const moduleDbId = await this.getModuleDbId();
        if (!childId || !moduleDbId) return;
        
        await supabase.from('module_responses').upsert({
          child_id: childId,
          module_id: moduleDbId,
          question_id: data.questionId,
          question_text: data.questionText || '',
          response_type: data.responseType || 'unknown',
          response_value: JSON.stringify(data.responseValue),
          response_options: data.responseOptions || null,
          selected_option: typeof data.selectedOption === 'number' ? data.selectedOption : null,
          page_number: data.pageNumber || 1,
          question_order: data.questionOrder || 1,
          is_correct: data.isCorrect ?? null,
          parent_user_id: parentUserId || null
        }, { onConflict: 'child_id,module_id,question_id' });
      },
      
      get(questionId) {
        const item = this.getCache()[questionId];
        return item?.responseValue;
      },
      
      getAll() { return this.getCache(); },
      
      async loadFromDB() {
        const moduleDbId = await this.getModuleDbId();
        if (!childId || !moduleDbId) return;
        try {
          const { data } = await supabase.from('module_responses')
            .select('*').eq('child_id', childId).eq('module_id', moduleDbId);
          if (data?.length) {
            const cache = this.getCache();
            data.forEach(r => {
              let val = r.response_value;
              try { val = JSON.parse(r.response_value); } catch (e) { /* use raw value */ }
              cache[r.question_id] = {
                questionId: r.question_id,
                questionText: r.question_text,
                responseType: r.response_type,
                responseValue: val,
                pageNumber: r.page_number,
                isCorrect: r.is_correct,
                timestamp: new Date(r.created_at).getTime()
              };
            });
            this.saveCache(cache);
          }
        } catch (e) {}
      }
    };
    
    window.ResponseTracker = ResponseTracker;
    window.trackResponse = d => ResponseTracker.track(d);
    window.getTrackedResponse = id => ResponseTracker.get(id);
    
    // =========================================
    // DATABASE HELPERS
    // =========================================
    async function _getChild(id) {
      const { data, error } = await supabase.from('children').select('*').eq('id', id).single();
      if (error) throw error;
      return data;
    }
    
    async function _updateStars(id, stars) {
      const { data, error } = await supabase.from('children').update({ stars }).eq('id', id).select().single();
      if (error) throw error;
      return data;
    }
    
    // =========================================
    // MODULE FUNCTIONS (Database-backed)
    // These MUST be set on window BEFORE module scripts run
    // =========================================
    
    // Initialize module and load child data
    window.initializeModule = async function(workbookId) {
      await ResponseTracker.loadFromDB();
      if (!_state.childId) {
        return null;
      }
      try {
        _state.currentChild = await _getChild(_state.childId);
        return _state.currentChild;
      } catch (e) {
        return null;
      }
    };
    
    // Load stars from database
    window.loadStarsFromDB = async function() {
      if (!_state.childId) {
        return 0;
      }
      try {
        _state.currentChild = await _getChild(_state.childId);
        const stars = _state.currentChild?.stars || 0;
        return stars;
      } catch (e) {
        return 0;
      }
    };
    
    // Save stars to database
    window.saveStarsToDB = async function(totalStars) {
      if (!_state.childId) {
        return;
      }
      try {
        await _updateStars(_state.childId, totalStars);
      } catch (e) {}
    };
    
    // Award a single star and return new total
    window.awardSingleStar = async function(currentStars) {
      if (!_state.childId) {
        return (currentStars || 0) + 1;
      }
      try {
        const child = await _getChild(_state.childId);
        const newStars = (child.stars || 0) + 1;
        const updated = await _updateStars(_state.childId, newStars);
        _state.currentChild = updated;
        return updated.stars;
      } catch (e) {
        return (currentStars || 0) + 1;
      }
    };
    
    // Get child's display name
    window.getChildName = function() {
      return _state.currentChild?.name || '';
    };
    
    // Get child ID
    window.getChildId = function() {
      return _state.childId;
    };
    
    // Resolve child display name with fallbacks
    window.resolveChildDisplayName = async function(opts = {}) {
      if (opts?.preferredName?.trim()) return opts.preferredName.trim();
      
      if (_state.currentChild?.name?.trim()) {
        return _state.currentChild.name.trim();
      }
      
      if (_state.childId && !_state.currentChild) {
        try {
          _state.currentChild = await _getChild(_state.childId);
          if (_state.currentChild?.name?.trim()) {
            return _state.currentChild.name.trim();
          }
        } catch (e) {}
      }
      
      return opts?.fallback || 'Friend';
    };
    
    // =========================================
    // MARK MODULE AS COMPLETED IN DATABASE
    // =========================================
    window.completeModuleDB = async function(modCode) {
      if (!_state.childId) {
        throw new Error('No child ID');
      }
      
      // Use moduleId from URL params if available, otherwise try to look up by code
      const params = new URLSearchParams(window.location.search);
      const moduleId = params.get('moduleId');
      
      if (!moduleId && !modCode && !moduleCode) {
        throw new Error('No module ID or code provided');
      }
      
      try {
        let modId = moduleId;
        let xpReward = 0;
        
        // If we don't have moduleId, try to look it up by code
        if (!modId) {
          const code = modCode || moduleCode;
          const { data: mod, error: modError } = await supabase
            .from('modules')
            .select('id, xp_reward')
            .eq('code', code)
            .single();
          
          if (modError || !mod) {
            throw new Error(`Module not found for code: ${code}`);
          }
          modId = mod.id;
          xpReward = mod.xp_reward || 0;
        } else {
          const { data: mod, error: modError } = await supabase
            .from('modules')
            .select('xp_reward')
            .eq('id', modId)
            .single();
          
          if (modError) {
            throw modError;
          }
          xpReward = mod?.xp_reward || 0;
        }
        
        console.log('[completeModuleDB] Marking module as complete:', { childId: _state.childId, moduleId: modId });
        
        const { data: existingRecord, error: checkError } = await supabase
          .from('child_modules')
          .select('id, is_completed')
          .eq('child_id', _state.childId)
          .eq('module_id', modId)
          .maybeSingle();
        
        if (checkError) {
          console.error('[completeModuleDB] Error checking existing record:', checkError);
          throw checkError;
        }
        
        let completionRecorded = false;
        
        if (existingRecord) {
          console.log('[completeModuleDB] Updating existing record:', existingRecord.id);
          console.log('[completeModuleDB] Existing record is_completed:', existingRecord.is_completed);
          console.log('[completeModuleDB] XP reward for module:', xpReward);
          
          if (!existingRecord.is_completed) {
            const { error: updateError } = await supabase
              .from('child_modules')
              .update({
                is_completed: true,
                completed_at: new Date().toISOString()
              })
              .eq('id', existingRecord.id);
            
            if (updateError) {
              console.error('[completeModuleDB] Error updating:', updateError);
              throw updateError;
            }
            completionRecorded = true;
            console.log('[completeModuleDB] Successfully marked as complete');
          } else {
            console.log('[completeModuleDB] Module already completed, not awarding XP again');
          }
        } else {
          console.log('[completeModuleDB] Creating new record');
          const { error: insertError } = await supabase
            .from('child_modules')
            .insert({
              child_id: _state.childId,
              module_id: modId,
              is_completed: true,
              completed_at: new Date().toISOString(),
              is_active: true
            });
          
          if (insertError) {
            console.error('[completeModuleDB] Error inserting:', insertError);
            throw insertError;
          }
          completionRecorded = true;
          console.log('[completeModuleDB] Successfully created completion record');
        }

        if (completionRecorded && xpReward > 0) {
          await awardModuleXp(_state.childId, xpReward);
        }
        
        return true;
      } catch (e) {
        console.error('[completeModuleDB] Failed:', e);
        throw e;
      }
    };

    async function awardModuleXp(childIdValue, xpReward) {
      console.log(`[awardModuleXp] Starting: Awarding ${xpReward} XP to child ${childIdValue}`);
      
      // Skip RPC attempt - function doesn't exist, go straight to direct update
      console.log('[awardModuleXp] RPC function not available, using direct database update...');
      
      // Fallback: Direct update
      console.log('[awardModuleXp] Performing direct database update...');
      
      // Get current child data
      const { data: child, error: childError } = await supabase
        .from('children')
        .select('total_xp, level')
        .eq('id', childIdValue)
        .single();
      
      if (childError) {
        console.error('[awardModuleXp] Error fetching child data:', childError);
        throw childError;
      }
      
      const currentXp = child?.total_xp || 0;
      const newTotalXp = currentXp + xpReward;
      console.log(`[awardModuleXp] Current XP: ${currentXp}, Adding: ${xpReward}, New Total: ${newTotalXp}`);
      
      // Calculate new level using the levels table
      let newLevel = 1;
      try {
        const { data: levelData } = await supabase
          .from('levels')
          .select('level')
          .lte('xp_required', newTotalXp)
          .order('xp_required', { ascending: false })
          .limit(1);
        
        if (levelData && levelData.length > 0) {
          newLevel = levelData[0].level || 1;
        }
        console.log(`[awardModuleXp] New level calculated: ${newLevel}`);
      } catch (levelError) {
        console.warn('[awardModuleXp] Error getting level from table, using fallback:', levelError);
        newLevel = Math.max(1, Math.floor(newTotalXp / 500) + 1);
      }
      
      // Perform the update
      const { data: updateResult, error: updateError } = await supabase
        .from('children')
        .update({ total_xp: newTotalXp, level: newLevel })
        .eq('id', childIdValue)
        .select()
        .single();
      
      if (updateError) {
        console.error('[awardModuleXp] Database update failed:', updateError);
        throw updateError;
      }
      
      console.log(`[awardModuleXp] SUCCESS: Awarded ${xpReward} XP, new total: ${updateResult.total_xp}, new level: ${updateResult.level}`);
    }
    
    // =========================================
    // MODULE COMPLETION HANDLING
    // =========================================
    let moduleCompletionHandled = false;

    // Global completeModule function for buttons in generated HTML
    window.completeModule = async function(childIdParam, moduleIdParam) {
      console.log('[completeModule] Button clicked');
      
      // If module not already completed, complete it and show celebration
      if (!moduleCompletionHandled) {
        window.handleModuleCompletion();
      } else {
        // Already completed, just go home
        console.log('[completeModule] Already completed, going home');
        const params = new URLSearchParams(window.location.search);
        const childId = params.get('childId');
        if (childId) {
          window.location.href = '/dashboard.html?childId=' + childId;
        } else {
          window.location.href = '/dashboard.html';
        }
      }
    };

    window.handleModuleCompletion = function() {
      if (moduleCompletionHandled) {
        return;
      }
      moduleCompletionHandled = true;

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlChildId = urlParams.get('childId');
        const urlModuleCode = urlParams.get('code');
        
        if (urlChildId && urlModuleCode) {
          completeModuleAndCelebrate();
        } else {
          window.showCompletionCelebration();
        }
      } catch (error) {
        window.showCompletionCelebration();
      }
    };

    async function completeModuleAndCelebrate() {
      try {
        await window.completeModuleDB();
        // Wait a moment for the database to update, then show celebration with fresh data
        setTimeout(() => {
          window.showCompletionCelebration();
        }, 100);
      } catch (error) {
        window.showCompletionCelebration();
      }
    }

    window.showCompletionCelebration = function() {
      if (document.querySelector('.module-completion-modal')) {
        return;
      }
      
      try {
        // Get XP information for display
        const getXpInfo = async () => {
          try {
            const params = new URLSearchParams(window.location.search);
            const moduleId = params.get('moduleId');
            const moduleCode = params.get('code');
            
            let xpReward = 0;
            let moduleTitle = 'this module';
            
            // Get module info and XP reward
            if (moduleId) {
              const { data: mod } = await supabase
                .from('modules')
                .select('title, xp_reward')
                .eq('id', moduleId)
                .single();
              
              if (mod) {
                moduleTitle = mod.title;
                xpReward = mod.xp_reward || 0;
              }
            } else if (moduleCode) {
              const { data: mod } = await supabase
                .from('modules')
                .select('title, xp_reward')
                .eq('code', moduleCode)
                .single();
              
              if (mod) {
                moduleTitle = mod.title;
                xpReward = mod.xp_reward || 0;
              }
            }
            
            // Get child's current XP and level info
            const { data: child } = await supabase
              .from('children')
              .select('total_xp, level')
              .eq('id', _state.childId)
              .single();
            
            const currentXp = child?.total_xp || 0;
            const currentLevel = child?.level || 1;
            const newTotalXp = currentXp + xpReward;
            
            // Get XP needed for next level
            let nextLevelXp = 0;
            let currentLevelXp = 0;
            let newLevel = currentLevel;
            
            try {
              // Get current level XP requirement
              const { data: currentLevelInfo } = await supabase
                .from('levels')
                .select('xp_required')
                .eq('level', currentLevel)
                .single();
              
              currentLevelXp = currentLevelInfo?.xp_required || 0;
              
              // Get next level XP requirement
              const { data: nextLevelInfo } = await supabase
                .from('levels')
                .select('xp_required')
                .eq('level', currentLevel + 1)
                .single();
              
              if (nextLevelInfo) {
                nextLevelXp = nextLevelInfo.xp_required;
                
                // Check if leveled up
                const { data: newLevelData } = await supabase
                  .from('levels')
                  .select('level')
                  .lte('xp_required', newTotalXp)
                  .order('xp_required', { ascending: false })
                  .limit(1)
                  .single();
                
                newLevel = newLevelData?.level || currentLevel;
              } else {
                // No next level, use current level XP * 1.5 as estimate
                nextLevelXp = Math.floor(currentLevelXp * 1.5);
              }
            } catch (levelError) {
              console.warn('[showCompletionCelebration] Error getting level info:', levelError);
              // Fallback calculation
              nextLevelXp = currentLevelXp + 500;
            }
            
            const xpNeededForNextLevel = nextLevelXp - currentLevelXp;
            const currentLevelProgress = currentXp - currentLevelXp;
            const newLevelProgress = newTotalXp - currentLevelXp;
            
            return {
              xpReward,
              moduleTitle,
              currentXp,
              newTotalXp,
              currentLevel,
              newLevel,
              xpNeededForNextLevel,
              currentLevelProgress,
              newLevelProgress,
              leveledUp: newLevel > currentLevel
            };
          } catch (error) {
            console.error('[showCompletionCelebration] Error getting XP info:', error);
            return {
              xpReward: 0,
              moduleTitle: 'this module',
              currentXp: 0,
              newTotalXp: 0,
              currentLevel: 1,
              newLevel: 1,
              xpNeededForNextLevel: 100,
              currentLevelProgress: 0,
              newLevelProgress: 0,
              leveledUp: false

        // Create and show modal
        const createModal = async () => {
          const xpInfo = await getXpInfo();
          
          const celebrationModal = document.createElement('div');
          celebrationModal.className = 'module-completion-modal';
          
          // XP progress bar HTML
          const progressBarHtml = xpInfo.xpReward > 0 ? `
            <div style="margin: 24px 0; padding: 20px; background: rgba(255, 255, 255, 0.3); border-radius: 12px;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <span style="font-size: 20px;">⭐</span>
                <span style="font-size: 14px; font-weight: 700; color: #405878;">XP Earned: +${xpInfo.xpReward}</span>
              </div>
              
              ${xpInfo.leveledUp ? `
                <div style="background: #4ade80; color: white; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-weight: 700;">
                  🎉 LEVEL UP! You reached Level ${xpInfo.newLevel}!
                </div>
              ` : ''}
              
              <div style="margin-bottom: 8px;">
                <div style="font-size: 12px; color: #405878; margin-bottom: 4px;">
                  Progress to Level ${xpInfo.currentLevel + (xpInfo.leveledUp ? 2 : 1)}
                </div>
                <div style="background: rgba(64, 88, 120, 0.2); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 4px;">
                  <div style="height: 100%; width: ${Math.min(100, (xpInfo.newLevelProgress / xpInfo.xpNeededForNextLevel) * 100)}%; background: linear-gradient(90deg, #4c6c96, #79a7d3); transition: width 0.5s ease;"></div>
                </div>
                <div style="font-size: 11px; color: #6d86a8; font-weight: 600;">
                  ${xpInfo.newLevelProgress} / ${xpInfo.xpNeededForNextLevel} XP
                  ${xpInfo.xpNeededForNextLevel - xpInfo.newLevelProgress > 0 ? 
                    `(${xpInfo.xpNeededForNextLevel - xpInfo.newLevelProgress} XP to next level)` : 
                    '(Level complete!)'
                  }
                </div>
              </div>
            </div>
          ` : '';
          
          celebrationModal.innerHTML = `
            <div class="module-completion-content">
              <div class="completion-emoji">${xpInfo.leveledUp ? '🎉' : '🎊'}</div>
              <h2 class="completion-title">${xpInfo.leveledUp ? 'Level Up!' : 'Fantastic Work!'}</h2>
              <p class="completion-message">
                ${xpInfo.leveledUp ? 
                  `Amazing! You completed "${xpInfo.moduleTitle}" and reached Level ${xpInfo.newLevel}!` :
                  `Congratulations! You've completed "${xpInfo.moduleTitle}" and learned valuable emotional skills.`
                }
              </p>
              ${progressBarHtml}
              <div class="completion-confetti" id="completionConfetti"></div>
              <button class="completion-btn" onclick="window.closeCompletionModal()">Continue Journey</button>
            </div>
          `;
          
          document.body.appendChild(celebrationModal);
          generateCompletionConfetti();
          
          setTimeout(() => {
            window.closeCompletionModal();

        console.error('[showCompletionCelebration] Error:', e);

    };

    function generateCompletionConfetti() {
      const container = document.getElementById('completionConfetti');
      if (!container) {
        return;

      container.innerHTML = '';
      const pieceCount = 50;
      
      for (let i = 0; i < pieceCount; i++) {
        const piece = document.createElement('div');
        piece.className = 'completion-confetti-piece';
        
        const randomX = Math.random() * 300 - 150;
        const randomDelay = Math.random() * 0.5;
        const colors = ['#f4a261', '#e76f51', '#2a9d8f', '#405878', '#4c6c96', '#ab47bc', '#ffd700', '#ff69b4'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = Math.random() * 30 + '%';
        piece.style.setProperty('--tx', randomX + 'px');
        piece.style.animationDelay = randomDelay + 's';

    // NOTE: window.initModuleHeader is already provided by the script tag loading module-header.js

    // =========================================

    window.enhancePageTracking = function(pageNum) {
      // Quiz answers
      document.querySelectorAll('.quiz-answer').forEach((btn, i) => {
        btn.addEventListener('click', function() {
          ResponseTracker.track({
            questionId: `quiz_p${pageNum}_${i}`,

            responseType: 'quiz',
            responseValue: this.textContent.trim(),
            pageNumber: pageNum,
            isCorrect: this.dataset.correct === 'true'
          });
        });
      });
      
      // Scenario options
      document.querySelectorAll('.scenario-option').forEach((btn, i) => {
        btn.addEventListener('click', function() {
          ResponseTracker.track({
            questionId: `scenario_p${pageNum}`,
            questionText: this.textContent.trim().slice(0, 100),
            responseType: 'scenario',
            responseValue: this.textContent.trim(),
            pageNumber: pageNum,
            isCorrect: this.dataset.good === 'true'
          });
        });
      });
      
      // Checklist items
      document.querySelectorAll('.checklist-item').forEach((item, i) => {
        item.addEventListener('change', function() {
          ResponseTracker.track({
            questionId: `checklist_p${pageNum}_${i}`,
            questionText: (this.nextElementSibling?.textContent || '').trim().slice(0, 100),
            responseType: 'checkbox',
            responseValue: this.checked,
            pageNumber: pageNum
          });
        });
      });
      
      // Activity completions
      document.querySelectorAll('[data-activity]').forEach(item => {
        item.addEventListener('change', function() {
          ResponseTracker.track({
            questionId: `activity_${this.dataset.activity}`,
            questionText: `Activity: ${this.dataset.activity}`,
            responseType: 'activity',
            responseValue: this.checked,
            pageNumber: pageNum
          });
        });
      });
      
      // Text inputs - save on both 'input' (with debounce) and 'change'
      document.querySelectorAll('.reflection-input, textarea, input[type="text"]').forEach((el, i) => {
        const id = el.id || el.name || `text_p${pageNum}_${i}`;
        let debounceTimer = null;
        
        // Save on input with debouncing (500ms delay)
        el.addEventListener('input', function() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            ResponseTracker.track({
              questionId: id,
              questionText: (el.placeholder || id).slice(0, 100),
              responseType: 'text',
              responseValue: this.value,
              pageNumber: pageNum
            });
          }, 500);
        });
        
        // Also save immediately on blur
        el.addEventListener('change', function() {
          clearTimeout(debounceTimer);
          ResponseTracker.track({
            questionId: id,
            questionText: (el.placeholder || id).slice(0, 100),
            responseType: 'text',
            responseValue: this.value,
            pageNumber: pageNum
          });
        });
      });
    };
    
    // Restore responses when navigating to a page
    window.restorePageResponses = function(pageNum) {
      const responses = ResponseTracker.getAll();
      
      console.log('[Restore] Page', pageNum, '- Found', Object.keys(responses).length, 'saved responses');
      
      // Restore checkboxes
      document.querySelectorAll('.checklist-item').forEach((item, i) => {

    // =========================================
    // STRIP STUB FUNCTIONS FROM GENERATED CODE
    // =========================================
    function stripStubFunctions(code) {
      // List of function names to strip (these are defined in module.html)
      const functionsToStrip = [
        'initializeModule',
        'loadStarsFromDB',
        'saveStarsToDB',
        'awardSingleStar',
        'resolveChildDisplayName',
        'getChildId',
        'completeModuleDB',
        'showCompletionCelebration',
        'generateCompletionConfetti',
        'handleModuleCompletion',
        'completeModule'
      ];
      
      let result = code;
      
      // Helper function to find matching closing brace
      function findMatchingBrace(str, startIndex) {
        let depth = 0;
        let inString = false;
        let stringChar = '';
        let inTemplate = false;
        
        for (let i = startIndex; i < str.length; i++) {
          const char = str[i];
          const prevChar = i > 0 ? str[i - 1] : '';
          
          // Handle string literals
          if ((char === '"' || char === "'" || char === '`') && prevChar !== '\\') {
            if (!inString) {
              inString = true;
              stringChar = char;
              if (char === '`') inTemplate = true;
            } else if (char === stringChar) {
              inString = false;
              inTemplate = false;
            }
            continue;
          }
          
          if (inString) continue;
          
          if (char === '{') {
            depth++;
          } else if (char === '}') {
            depth--;
            if (depth === 0) {
              return i;
            }
          }
        }
        return -1;
      }
      
      // Strip each function
      for (const funcName of functionsToStrip) {
        // Match both "async function name" and "function name" patterns
        const patterns = [
          new RegExp(`(async\\s+)?function\\s+${funcName}\\s*\\([^)]*\\)\\s*\\{`),
        ];
        
        for (const pattern of patterns) {
          let match;
          while ((match = pattern.exec(result)) !== null) {
            const startIndex = match.index;
            const braceStart = result.indexOf('{', startIndex);
            if (braceStart === -1) break;
            
            const braceEnd = findMatchingBrace(result, braceStart);
            if (braceEnd === -1) break;
            
            // Replace the entire function with a comment
            const before = result.substring(0, startIndex);
            const after = result.substring(braceEnd + 1);
            result = before + `/* [${funcName} stub removed - using module.html version] */` + after;
          }
        }
      }
      
      // Also remove window.closeCompletionModal assignments
      result = result.replace(
        /window\.closeCompletionModal\s*=\s*function\s*\([^)]*\)\s*\{[^{}]*\};?/g,
        '/* [closeCompletionModal removed] */'
      );
      
      // Remove let moduleCompletionHandled declarations
      result = result.replace(
        /let\s+moduleCompletionHandled\s*=\s*(true|false)\s*;?/g,
        '/* [moduleCompletionHandled removed] */'
      );
      
      return result;
    }
    
    // =========================================
    // LOAD MODULE
    // =========================================
    function showError(title, msg) {
      document.body.innerHTML = `<div class="error-container"><div class="error-box">
        <h2>⚠️ ${title}</h2><p>${msg}</p>
        <button onclick="history.back()">Go Back</button>
        <button onclick="location.reload()">Retry</button>
      </div></div>`;
    }
    
    async function loadModule() {
      // Use moduleId instead of moduleCode since new modules have empty code fields
      if (!moduleId) { 
        // Fallback to moduleCode for backward compatibility
        if (!moduleCode) { 
          showError('No Module', 'No module ID or code in URL'); 
          return; 
        }
      }
      
      try {
        let mod;

        /**
         * Resolve a child's date of birth to the appropriate age band.
         * Used to select the correct multi-age variant for rendering.
         * Falls back to nearest band if age is outside 6-18 range.
         */
        function resolveAgeBandFromDob(dateOfBirth) {
          if (!dateOfBirth) return '6-8'; // safe default
          var dob = new Date(dateOfBirth);
          var age = Math.floor((Date.now() - dob.getTime()) / (365.25 * 24 * 60 * 60 * 1000));
          if (age <= 8) return '6-8';
          if (age <= 11) return '9-11';
          if (age <= 14) return '12-14';
          return '15-18';
        }

        if (moduleId) {
          // Try to get module by ID first (preferred method for new modules)
          // Include is_multi_age to determine variant loading path
          const { data: modData, error: fetchError } = await supabase
            .from('modules')
            .select('html_content, title, code, id, short_description, is_multi_age')
            .eq('id', moduleId)
            .single();

          if (fetchError) throw new Error(fetchError.message);

          // Multi-age variant loading:
          // If is_multi_age is true, resolve child's age band and load from module_variants.
          // Legacy modules (is_multi_age = false/null) use html_content directly.
          if (modData?.is_multi_age && childId) {
            // Fetch child's DOB to resolve age band
            const { data: childData } = await supabase
              .from('children')
              .select('date_of_birth')
              .eq('id', childId)
              .single();

            const ageBand = resolveAgeBandFromDob(childData?.date_of_birth);
            console.log('[Module] Multi-age module detected. Child age band:', ageBand);

            // Try to load the matching variant
            const { data: variant } = await supabase
              .from('module_variants')
              .select('html_content')
              .eq('module_id', modData.id)
              .eq('age_band', ageBand)
              .single();

            if (variant?.html_content) {
              mod = { ...modData, html_content: variant.html_content };
            } else {
              // Fallback: try nearest available band
              console.warn('[Module] No variant for band', ageBand, '— trying fallback');
              const { data: allVariants } = await supabase
                .from('module_variants')
                .select('age_band, html_content')
                .eq('module_id', modData.id);

              if (allVariants && allVariants.length > 0) {
                // Find nearest band
                var bandMidpoints = { '6-8': 7, '9-11': 10, '12-14': 13, '15-18': 16.5 };
                var targetMid = bandMidpoints[ageBand] || 8.5;
                var closest = allVariants[0];
                var closestDist = Math.abs((bandMidpoints[closest.age_band] || 8.5) - targetMid);
                for (var av of allVariants) {
                  var dist = Math.abs((bandMidpoints[av.age_band] || 8.5) - targetMid);
                  if (dist < closestDist) { closest = av; closestDist = dist; }
                }
                console.warn('[Module] Using fallback variant:', closest.age_band);
                mod = { ...modData, html_content: closest.html_content };
              } else {
                // No variants at all — use base html_content
                mod = modData;
              }
            }
          } else {
            // Legacy single-age path — unchanged
            if (!modData?.html_content) throw new Error('Module not found or has no content');
            mod = modData;
          }
        } else {
          // Fallback to code for backward compatibility
          const { data: mods, error: fetchError } = await supabase
            .from('modules')
            .select('html_content, title, code, id, short_description')
            .eq('code', moduleCode);

          if (fetchError) throw new Error(fetchError.message);

          if (!mods || mods.length === 0) {
            throw new Error(`No module found with code: ${moduleCode}`);
          }

          if (mods.length > 1) {
            console.warn(`Multiple modules found with code ${moduleCode}, using first one`);
          }

          mod = mods[0];
          if (!mod?.html_content) throw new Error('Module has no content');
        }
        
        _state.moduleDbId = mod.id;
        document.title = mod.title || 'Module';

        function findFirstModulePage() {
          var container = document.getElementById('pageContainer');
          if (container && container.firstElementChild) {
            return container.firstElementChild;
          }
          return document.querySelector('.page, .module-page, [data-module-page], [data-page]');
        }

        function ensureModuleCoverTitle(moduleData) {
          var firstPage = findFirstModulePage();
          if (!firstPage) return false;
          if (firstPage.querySelector('[data-module-cover="title"]')) return true;

          
          return true;
        }

        // Clean HTML-encoded apostrophes from legacy modules (generated before fix)
        // Handle double-encoded (&amp;#039;) first, then single-encoded (&#039;)
        const cleanedHtml = mod.html_content.replace(/&amp;#039;/g, "'").replace(/&#039;/g, "'");

        const parser = new DOMParser();
        const doc = parser.parseFromString(cleanedHtml, 'text/html');
        
        // Copy styles
        doc.querySelectorAll('style').forEach(s => {
          const ns = document.createElement('style');
          ns.textContent = s.textContent;
          document.head.appendChild(ns);
        });
        
        // Copy CSS links
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(l => {
          if (!document.querySelector(`link[href="${l.getAttribute('href')}"]`)) {
            document.head.appendChild(l.cloneNode(true));
          }
        });
        
        // Copy body attributes
        Array.from(doc.body.attributes).forEach(a => document.body.setAttribute(a.name, a.value));
        
        // Extract scripts
        const scripts = [];
        doc.querySelectorAll('script').forEach(s => {
          const src = s.getAttribute('src');
          if (src && (src.includes('jsdelivr') || src.includes('module-') || src.includes('supabase'))) return;
          if (s.textContent.trim()) scripts.push(s.textContent);
        });
        doc.querySelectorAll('script').forEach(s => s.remove());
        
        // Inject HTML
        document.getElementById('loader').style.display = 'none';
        const div = document.createElement('div');
        div.innerHTML = doc.body.innerHTML;
        while (div.firstChild) document.body.appendChild(div.firstChild);

        window.ensureModuleCoverTitle = function() { return ensureModuleCoverTitle(mod); };
        window.ensureModuleCoverTitle();

        var coverObserver = new MutationObserver(function() {
          if (ensureModuleCoverTitle(mod)) {
            coverObserver.disconnect();
          }
        });
        coverObserver.observe(document.body, { childList: true, subtree: true });
        
        // Execute scripts with tracking injection AND stub removal
        if (scripts.length) {
          let code = scripts.join('\n\n');
          
          // Remove import statements
          code = code.replace(/^\s*import\s+[\s\S]*?from\s+['"][^'"]*['"];?\s*$/gm, '');
          code = code.replace(/^\s*import\s+['"][^'"]*['"];?\s*$/gm, '');
          
          // Strip the buggy stub functions from generated module
          code = stripStubFunctions(code);
          
          // Inject tracking into renderPage
          code = code.replace(
            /function\s+renderPage\s*\(\s*\)\s*\{/,
            'function renderPage() { if (window.ensureModuleCoverTitle) { window.ensureModuleCoverTitle(); } setTimeout(function() { if (typeof currentPage !== "undefined") { window.enhancePageTracking(currentPage); window.restorePageResponses(currentPage); } }, 50);'
          );
          
          // Wrap the code safely
          const wrappedCode = `
(async function() {
  // Override DOMContentLoaded to run immediately since DOM is already loaded
  var _originalAddEventListener = document.addEventListener.bind(document);
  document.addEventListener = function(type, listener, options) {
    if (type === 'DOMContentLoaded') {
      setTimeout(listener, 0);
    } else {
      _originalAddEventListener(type, listener, options);
    }
  };
  
  try {
    ${code}
  } catch(e) {
    console.error('Module script error:', e);
  }
  
  // Restore original addEventListener
  document.addEventListener = _originalAddEventListener;
})();
`;
          
          // Use Blob URL to avoid any escaping issues
          const blob = new Blob([wrappedCode], { type: 'application/javascript' });
          const scriptUrl = URL.createObjectURL(blob);
          const el = document.createElement('script');
          el.src = scriptUrl;
          el.onload = () => {
            URL.revokeObjectURL(scriptUrl);
          };
          el.onerror = (e) => console.error('Script load error:', e);
          document.body.appendChild(el);
        }
        
      } catch (e) {
        console.error('Load error:', e);
        showError('Load Failed', e.message);
      }
    }
    
    // Add fadeOut animation for modal
    const fadeOutStyle = document.createElement('style');
    fadeOutStyle.textContent = `
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
    `;
    document.head.appendChild(fadeOutStyle);
    
    // =========================================
    // PAGE CHANGE OBSERVER
    // Watch for page changes but DO NOT auto-complete
    // =========================================
    function setupPageObserver() {
      // Watch for changes to the module header page display ONLY
      const observer = new MutationObserver((mutations) => {
        // Only look at the specific module header page display element
        const pageDisplay = document.querySelector('.module-header__page');
        if (!pageDisplay) return;
        
        const text = pageDisplay.textContent || '';
        // Match patterns like "Page 21 of 21" or "21 of 21"
        const match = text.match(/(?:Page\s+)?(\d+)\s+of\s+(\d+)/i);
        if (match) {
          const current = parseInt(match[1], 10);
          const total = parseInt(match[2], 10);
          // REMOVED: Auto-completion when reaching last page
          // Modules should only complete when explicitly requested via button click
          console.log(`Page ${current} of ${total} - Auto-completion disabled`);
        }
      });
      
      // Observe the entire body for changes
      observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
      });
      
    }
    
    // Set up observer after a short delay to let the module load
    setTimeout(setupPageObserver, 1000);
    
    loadModule();
  </script>
