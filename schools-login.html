<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Diaries - Schools Program</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logos/FM-LOGO-Light.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logos/FM-LOGO-Light.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logos/FM-LOGO-Light.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #dfdbca;
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* ========== Schools Identity ========== */
        .schools-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 40%, #fffff5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .schools-container::before {
            content: '';
            position: absolute;
            top: -80px;
            left: -80px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(149, 213, 178, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .schools-container::after {
            content: '';
            position: absolute;
            bottom: -120px;
            right: -120px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(183, 228, 199, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .schools-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* ========== Character Side ========== */
        .schools-character {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .character-image {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.15));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .schools-badge {
            background: linear-gradient(135deg, #2d6a4f, #40916c);
            color: white;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
        }

        /* ========== Card ========== */
        .schools-card {
            background-color: #fffff5;
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 3px solid #d8f3dc;
        }

        .schools-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .schools-logo {
            height: 70px;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
        }

        .schools-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .schools-subtitle {
            color: #52b788;
            font-size: 14px;
            font-weight: 500;
        }

        /* ========== Forms ========== */
        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            color: #2d6a4f;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d8f3dc;
            border-radius: 14px;
            font-size: 16px;
            background-color: #FAFBFC;
            color: #2d6a4f;
            outline: none;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-select:focus {
            border-color: #40916c;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
        }

        .form-input::placeholder { color: #A8C8B8; }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 20px rgba(45, 106, 79, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background-color: #FFE5E5;
            color: #C62828;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #C62828;
            font-weight: 500;
        }

        .success-message {
            background-color: #d8f3dc;
            color: #1b4332;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #2d6a4f;
            font-weight: 500;
        }

        .form-note {
            text-align: center;
            margin-top: 20px;
            color: #6B7C8F;
            font-size: 14px;
        }

        .form-link {
            color: #40916c;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-size: inherit;
            font-family: inherit;
        }

        .form-link:hover { color: #2d6a4f; text-decoration: underline; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6B7C8F;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.2s;
        }

        .back-link:hover { color: #2d6a4f; }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d8f3dc;
            transition: all 0.3s;
        }

        .step-dot.active { background: #40916c; transform: scale(1.2); }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .home-link {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .home-link:hover { opacity: 1; }

        /* ========== Responsive ========== */
        @media (max-width: 1024px) {
            .schools-wrapper {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .schools-character { max-width: 260px; margin: 0 auto; }
            .character-image { max-width: 240px; }
        }

        @media (max-width: 768px) {
            .schools-container { padding: 16px; align-items: flex-start; padding-top: 70px; }
            .schools-card { padding: 32px 24px; border-radius: 24px; }
            .schools-title { font-size: 26px; }
            .schools-logo { display: none; }
            .character-image { max-width: 180px; margin-bottom: -40px; }
        }
    </style>
</head>
<body>
    <div class="schools-container">
        <a href="/" class="home-link">&#8592; Back to Daniel's Diaries</a>

        <div class="schools-wrapper">
            <!-- Character Side -->
            <div class="schools-character">
                <img src="/images/characters/DanielTheDogReading.webp" alt="Daniel the Dog" class="character-image">
                <span class="schools-badge">Schools Program</span>
            </div>

            <!-- Card -->
            <div class="schools-card">
                <div class="schools-header">
                    <img src="/images/logos/FM-LOGO-Light.png" alt="Daniel's Diaries Logo" class="schools-logo">
                    <h1 class="schools-title">Schools Program</h1>
                    <p class="schools-subtitle">Delivered by your school practitioner</p>
                </div>

                <!-- Messages -->
                <div id="errorMessage" class="error-message hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>

                <!-- Step 1: School Selection & Access Key -->
                <div id="schoolSelectStep">
                    <div class="step-indicator">
                        <div class="step-dot active"></div>
                        <div class="step-dot"></div>
                    </div>

                    <form id="schoolAccessForm">
                        <div class="form-group">
                            <label class="form-label">Select Your School</label>
                            <select id="schoolDropdown" class="form-select" required>
                                <option value="">Choose your school...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">School Access Key</label>
                            <input type="password" id="accessKeyInput" class="form-input" placeholder="Enter your school's access key" required>
                        </div>

                        <button type="submit" class="btn-primary" id="validateBtn">
                            <span id="validateBtnText">Continue</span>
                            <span id="validateSpinner" class="spinner hidden"></span>
                        </button>
                    </form>
                </div>

                <!-- Step 2a: Login -->
                <div id="loginStep" class="hidden">
                    <div class="step-indicator">
                        <div class="step-dot active"></div>
                        <div class="step-dot active"></div>
                    </div>

                    <button type="button" class="back-link" onclick="backToSchoolSelect()">&#8592; Change school</button>

                    <form id="schoolLoginForm">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="schoolLoginEmail" class="form-input" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="schoolLoginPassword" class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
                        </div>

                        <button type="submit" class="btn-primary" id="schoolLoginBtn">
                            <span id="schoolLoginBtnText">Sign In</span>
                            <span id="schoolLoginSpinner" class="spinner hidden"></span>
                        </button>
                    </form>

                    <p class="form-note">
                        New to the program?
                        <button type="button" class="form-link" onclick="showSchoolSignup()">Create an account</button>
                    </p>
                </div>

                <!-- Step 2b: Signup -->
                <div id="signupStep" class="hidden">
                    <div class="step-indicator">
                        <div class="step-dot active"></div>
                        <div class="step-dot active"></div>
                    </div>

                    <button type="button" class="back-link" onclick="showSchoolLogin()">&#8592; Back to sign in</button>

                    <form id="schoolSignupForm">
                        <div class="form-group">
                            <label class="form-label">Your Name</label>
                            <input type="text" id="schoolSignupName" class="form-input" placeholder="First name or display name" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">I am a...</label>
                            <select id="schoolSignupRole" class="form-select" required>
                                <option value="">Select your role</option>
                                <option value="child">Student</option>
                                <option value="practitioner">Practitioner</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="schoolSignupEmail" class="form-input" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="schoolSignupPassword" class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="schoolSignupPasswordConfirm" class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
                        </div>

                        <button type="submit" class="btn-primary" id="schoolSignupBtn">
                            <span id="schoolSignupBtnText">Create Account</span>
                            <span id="schoolSignupSpinner" class="spinner hidden"></span>
                        </button>
                    </form>

                    <p class="form-note">
                        Already have an account?
                        <button type="button" class="form-link" onclick="showSchoolLogin()">Sign in</button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/features/schools/schoolsLoginPage.js"></script>
</body>
</html>
